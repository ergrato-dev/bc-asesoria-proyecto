<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .title { font-family: 'Inter','Segoe UI',sans-serif; font-size: 20px; font-weight: 700; fill: #e7e7e7; }
      .step { fill: #161b22; stroke: #1565c0; stroke-width: 2; }
      .stepFail { fill: #161b22; stroke: #8b949e; stroke-width: 2; stroke-dasharray: 5 4; }
      .stepText { font-family: 'Inter','Segoe UI',sans-serif; font-size: 14px; font-weight: 600; fill: #e7e7e7; text-anchor: middle; }
      .subText { font-family: 'Inter','Segoe UI',sans-serif; font-size: 11px; fill: #8b949e; text-anchor: middle; }
      .arrow { stroke: #58a6ff; stroke-width: 2; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#58a6ff"/>
    </marker>
  </defs>
  <rect class="bg" width="800" height="280" rx="10"/>
  <text x="30" y="32" class="title">Orden de arranque con depends_on + healthcheck</text>

  <rect class="step" x="30" y="90" width="130" height="60" rx="6"/>
  <text x="95" y="115" class="stepText">db: arranca</text>
  <text x="95" y="132" class="subText">contenedor iniciado</text>

  <line x1="160" y1="120" x2="195" y2="120" class="arrow"/>

  <rect class="step" x="200" y="90" width="150" height="60" rx="6"/>
  <text x="275" y="115" class="stepText">db: healthy</text>
  <text x="275" y="132" class="subText">healthcheck: pg_isready</text>

  <line x1="350" y1="120" x2="385" y2="120" class="arrow"/>

  <rect class="step" x="390" y="90" width="150" height="60" rx="6"/>
  <text x="465" y="115" class="stepText">be: arranca</text>
  <text x="465" y="132" class="subText">condition: service_healthy</text>

  <line x1="540" y1="120" x2="575" y2="120" class="arrow"/>

  <rect class="step" x="580" y="90" width="190" height="60" rx="6"/>
  <text x="675" y="115" class="stepText">fe: arranca</text>
  <text x="675" y="132" class="subText">condition: be service_healthy</text>

  <rect class="stepFail" x="130" y="200" width="400" height="55" rx="6"/>
  <text x="330" y="222" class="stepText" style="fill:#c9d1d9">Sin condition: be arranca al iniciar el</text>
  <text x="330" y="240" class="stepText" style="fill:#c9d1d9">contenedor de db, no espera a que esté listo</text>
  <line x1="275" y1="150" x2="275" y2="198" stroke="#8b949e" stroke-width="2" stroke-dasharray="4 3"/>
</svg>
