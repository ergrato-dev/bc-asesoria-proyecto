<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .title { font-family: 'Inter','Segoe UI',sans-serif; font-size: 20px; font-weight: 700; fill: #e7e7e7; }
      .step { fill: #161b22; stroke: #1565c0; stroke-width: 2; }
      .stepNeutral { fill: #161b22; stroke: #30363d; stroke-width: 2; }
      .stepFail { fill: #161b22; stroke: #8b949e; stroke-width: 2; stroke-dasharray: 5 4; }
      .stepText { font-family: 'Inter','Segoe UI',sans-serif; font-size: 14px; font-weight: 600; fill: #e7e7e7; text-anchor: middle; }
      .subText { font-family: 'Inter','Segoe UI',sans-serif; font-size: 11px; fill: #8b949e; text-anchor: middle; }
      .arrow { stroke: #58a6ff; stroke-width: 2; marker-end: url(#arrowhead); }
      .arrowFail { stroke: #8b949e; stroke-width: 2; stroke-dasharray: 5 4; marker-end: url(#arrowheadGrey); }
      .connector { stroke: #8b949e; stroke-width: 2; stroke-dasharray: 4 3; }
      .noteText { font-family: 'Inter','Segoe UI',sans-serif; font-size: 12.5px; font-weight: 600; fill: #c9d1d9; text-anchor: middle; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#58a6ff"/>
    </marker>
    <marker id="arrowheadGrey" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect class="bg" width="760" height="400" rx="10"/>
  <text x="30" y="36" class="title">.env vs .env.example — el límite del .gitignore</text>

  <!-- Fila principal: sí se commitea -->
  <rect class="step" x="30" y="90" width="170" height="60" rx="6"/>
  <text x="115" y="113" class="stepText">.env.example</text>
  <text x="115" y="132" class="subText">plantilla, valores vacíos</text>

  <line x1="200" y1="120" x2="245" y2="120" class="arrow"/>

  <rect class="step" x="250" y="90" width="200" height="60" rx="6"/>
  <text x="350" y="113" class="stepText">git add / commit / push</text>
  <text x="350" y="132" class="subText">flujo normal del repo</text>

  <line x1="450" y1="120" x2="495" y2="120" class="arrow"/>

  <rect class="step" x="500" y="90" width="220" height="60" rx="6"/>
  <text x="610" y="113" class="stepText">Historial de GitHub</text>
  <text x="610" y="132" class="subText">visible para todo el equipo</text>

  <!-- Conector vertical hacia .env local -->
  <line x1="115" y1="150" x2="115" y2="193" class="connector"/>

  <!-- Fila secundaria: nunca se commitea -->
  <rect class="stepNeutral" x="30" y="195" width="170" height="60" rx="6"/>
  <text x="115" y="218" class="stepText">.env (local)</text>
  <text x="115" y="237" class="subText">valores reales, por integrante</text>

  <line x1="200" y1="225" x2="495" y2="225" class="arrowFail"/>

  <rect class="stepFail" x="500" y="195" width="220" height="60" rx="6"/>
  <text x="610" y="215" class="stepText">Bloqueado por .gitignore</text>
  <text x="610" y="232" class="subText" style="fill:#c9d1d9">.env nunca llega a GitHub</text>
  <text x="610" y="247" class="subText">está en .gitignore desde la semana 1</text>

  <!-- Nota final -->
  <rect class="step" x="30" y="290" width="690" height="70" rx="6"/>
  <text x="375" y="315" class="noteText">Si un secreto se commiteó por error, no basta con borrarlo en el siguiente</text>
  <text x="375" y="333" class="noteText">commit — sigue en el historial de Git. Hay que ROTAR la clave y avisar al equipo.</text>
</svg>
