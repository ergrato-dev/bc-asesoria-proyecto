<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .title { font-family: 'Inter','Segoe UI',sans-serif; font-size: 20px; font-weight: 700; fill: #e7e7e7; }
      .laneLabel { font-family: 'Inter','Segoe UI',sans-serif; font-size: 14px; font-weight: 700; fill: #c9d1d9; }
      .note { font-family: 'Inter','Segoe UI',sans-serif; font-size: 12px; fill: #8b949e; }
      .commit { fill: #1565c0; stroke: #58a6ff; stroke-width: 1.5; }
      .lane { stroke: #30363d; stroke-width: 2; fill: none; }
      .laneMain { stroke: #58a6ff; stroke-width: 3; fill: none; }
    </style>
  </defs>
  <rect class="bg" width="760" height="340" rx="10"/>
  <text x="30" y="36" class="title">Flujo de Git — feature → develop → main</text>

  <!-- main lane -->
  <text x="30" y="90" class="laneLabel">main</text>
  <line x1="90" y1="86" x2="720" y2="86" class="laneMain"/>
  <circle cx="150" cy="86" r="7" class="commit"/>
  <circle cx="430" cy="86" r="7" class="commit"/>
  <circle cx="700" cy="86" r="7" class="commit"/>
  <text x="130" y="70" class="note">checkpoint Sprint 1</text>
  <text x="400" y="70" class="note">checkpoint Sprint 2</text>

  <!-- develop lane -->
  <text x="30" y="180" class="laneLabel">develop</text>
  <line x1="90" y1="176" x2="720" y2="176" class="lane"/>
  <circle cx="150" cy="176" r="6" class="commit"/>
  <circle cx="220" cy="176" r="6" class="commit"/>
  <circle cx="300" cy="176" r="6" class="commit"/>
  <circle cx="380" cy="176" r="6" class="commit"/>
  <circle cx="430" cy="176" r="6" class="commit"/>
  <circle cx="520" cy="176" r="6" class="commit"/>
  <circle cx="620" cy="176" r="6" class="commit"/>
  <circle cx="700" cy="176" r="6" class="commit"/>

  <!-- merge from main to develop (vertical) -->
  <line x1="150" y1="86" x2="150" y2="176" stroke="#8b949e" stroke-dasharray="4 4"/>
  <line x1="430" y1="86" x2="430" y2="176" stroke="#8b949e" stroke-dasharray="4 4"/>
  <line x1="700" y1="86" x2="700" y2="176" stroke="#8b949e" stroke-dasharray="4 4"/>

  <!-- feature lane 1 -->
  <text x="30" y="250" class="laneLabel">feature/login</text>
  <path class="lane" d="M220,176 C240,220 260,220 280,220 L360,220 C380,220 390,190 390,176"/>
  <circle cx="280" cy="220" r="5" class="commit"/>
  <circle cx="330" cy="220" r="5" class="commit"/>

  <!-- feature lane 2 -->
  <text x="30" y="300" class="laneLabel">feature/user-crud</text>
  <path class="lane" d="M300,176 C320,260 340,260 360,260 L470,260 C490,260 500,200 520,176"/>
  <circle cx="380" cy="260" r="5" class="commit"/>
  <circle cx="440" cy="260" r="5" class="commit"/>

  <text x="30" y="325" class="note">PR + revisión → merge a develop · checkpoint de sprint → merge --no-ff a main</text>
</svg>
