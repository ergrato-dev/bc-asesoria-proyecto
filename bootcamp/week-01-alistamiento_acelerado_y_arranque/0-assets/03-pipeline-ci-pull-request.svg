<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .title { font-family: 'Inter','Segoe UI',sans-serif; font-size: 20px; font-weight: 700; fill: #e7e7e7; }
      .step { fill: #161b22; stroke: #1565c0; stroke-width: 2; }
      .stepFail { fill: #161b22; stroke: #8b949e; stroke-width: 2; stroke-dasharray: 5 4; }
      .stepText { font-family: 'Inter','Segoe UI',sans-serif; font-size: 14px; font-weight: 600; fill: #e7e7e7; text-anchor: middle; }
      .subText { font-family: 'Inter','Segoe UI',sans-serif; font-size: 11px; fill: #8b949e; text-anchor: middle; }
      .arrow { stroke: #58a6ff; stroke-width: 2; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#58a6ff"/>
    </marker>
  </defs>
  <rect class="bg" width="760" height="260" rx="10"/>
  <text x="30" y="36" class="title">Pipeline de CI en cada Pull Request</text>

  <rect class="step" x="30" y="90" width="120" height="60" rx="6"/>
  <text x="90" y="115" class="stepText">Abrir PR</text>
  <text x="90" y="132" class="subText">feature/* → develop</text>

  <line x1="150" y1="120" x2="195" y2="120" class="arrow"/>

  <rect class="step" x="200" y="90" width="120" height="60" rx="6"/>
  <text x="260" y="115" class="stepText">Lint</text>
  <text x="260" y="132" class="subText">estándar de código</text>

  <line x1="320" y1="120" x2="365" y2="120" class="arrow"/>

  <rect class="step" x="370" y="90" width="120" height="60" rx="6"/>
  <text x="430" y="115" class="stepText">Test</text>
  <text x="430" y="132" class="subText">unitarias / integración</text>

  <line x1="490" y1="120" x2="535" y2="120" class="arrow"/>

  <rect class="step" x="540" y="90" width="180" height="60" rx="6"/>
  <text x="630" y="115" class="stepText">Merge a develop</text>
  <text x="630" y="132" class="subText">solo si todo pasó en verde</text>

  <rect class="stepFail" x="370" y="185" width="290" height="50" rx="6"/>
  <text x="515" y="212" class="stepText" style="fill:#c9d1d9">Rojo → PR bloqueado, no se puede mergear</text>
  <line x1="430" y1="150" x2="430" y2="183" stroke="#8b949e" stroke-width="2" stroke-dasharray="4 3"/>
</svg>
