<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #30363d; stroke-width: 1.5; }
      .boxAccent { fill: #161b22; stroke: #1565c0; stroke-width: 2; }
      .callout { fill: #0d1117; stroke: #58a6ff; stroke-width: 1.5; }
      .title { font-family: 'Inter','Segoe UI',sans-serif; font-size: 20px; font-weight: 700; fill: #e7e7e7; }
      .label { font-family: 'Inter','Segoe UI',sans-serif; font-size: 15px; font-weight: 600; fill: #58a6ff; }
      .item { font-family: 'Inter','Segoe UI',sans-serif; font-size: 13px; fill: #c9d1d9; }
      .calloutTitle { font-family: 'Inter','Segoe UI',sans-serif; font-size: 12px; font-weight: 700; fill: #58a6ff; }
      .calloutText { font-family: 'Inter','Segoe UI',sans-serif; font-size: 12px; fill: #8b949e; }
      .note { font-family: 'Inter','Segoe UI',sans-serif; font-size: 12px; fill: #8b949e; }
    </style>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrowGray" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect class="bg" width="760" height="400" rx="10"/>
  <text x="30" y="38" class="title">Capas: Endpoint → Servicio → Repositorio</text>

  <!-- Endpoint -->
  <rect class="boxAccent" x="30" y="70" width="210" height="300" rx="6"/>
  <text x="46" y="96" class="label">Endpoint</text>
  <rect class="box" x="46" y="112" width="178" height="34" rx="4"/>
  <text x="58" y="134" class="item">Traduce HTTP ↔ dominio</text>
  <rect class="box" x="46" y="154" width="178" height="34" rx="4"/>
  <text x="58" y="176" class="item">Valida formato y tipo</text>
  <rect class="box" x="46" y="196" width="178" height="34" rx="4"/>
  <text x="58" y="218" class="item">Traduce excepción → HTTP</text>
  <rect class="callout" x="46" y="246" width="178" height="52" rx="4"/>
  <text x="58" y="266" class="calloutTitle">VALIDACIÓN DE ENTRADA</text>
  <text x="58" y="284" class="calloutText">vive en el borde</text>

  <!-- Servicio -->
  <rect class="boxAccent" x="275" y="70" width="210" height="300" rx="6"/>
  <text x="291" y="96" class="label">Servicio</text>
  <rect class="box" x="291" y="112" width="178" height="34" rx="4"/>
  <text x="303" y="134" class="item">Aplica reglas de negocio</text>
  <rect class="box" x="291" y="154" width="178" height="34" rx="4"/>
  <text x="303" y="176" class="item">Orquesta el caso de uso</text>
  <rect class="box" x="291" y="196" width="178" height="34" rx="4"/>
  <text x="303" y="218" class="item">Lanza excepción propia</text>
  <rect class="callout" x="291" y="246" width="178" height="52" rx="4"/>
  <text x="303" y="266" class="calloutTitle">VALIDACIÓN DE DOMINIO</text>
  <text x="303" y="284" class="calloutText">vive en el servicio</text>

  <!-- Repositorio -->
  <rect class="boxAccent" x="520" y="70" width="210" height="300" rx="6"/>
  <text x="536" y="96" class="label">Repositorio</text>
  <rect class="box" x="536" y="112" width="178" height="34" rx="4"/>
  <text x="548" y="134" class="item">Lee y escribe datos</text>
  <rect class="box" x="536" y="154" width="178" height="34" rx="4"/>
  <text x="548" y="176" class="item">No decide permisos</text>
  <rect class="box" x="536" y="196" width="178" height="34" rx="4"/>
  <text x="548" y="218" class="item">Sin lógica de negocio</text>
  <rect class="callout" x="536" y="246" width="178" height="52" rx="4"/>
  <text x="548" y="266" class="calloutTitle">SOLO PERSISTENCIA</text>
  <text x="548" y="284" class="calloutText">no valida nada</text>

  <!-- flujo hacia adelante (petición ya validada) -->
  <line x1="243" y1="150" x2="272" y2="150" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="488" y1="150" x2="517" y2="150" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- retorno (resultado o excepción de dominio) -->
  <line x1="272" y1="210" x2="243" y2="210" stroke="#8b949e" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrowGray)"/>
  <line x1="517" y1="210" x2="488" y2="210" stroke="#8b949e" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrowGray)"/>

  <text x="30" y="390" class="note">→ sólido: petición ya validada    ┄→ discontinuo: resultado o excepción de dominio</text>
</svg>
