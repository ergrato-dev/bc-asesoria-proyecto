<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .title { font-family: 'Inter','Segoe UI',sans-serif; font-size: 20px; font-weight: 700; fill: #e7e7e7; }
      .step { fill: #161b22; stroke: #1565c0; stroke-width: 2; }
      .stepText { font-family: 'Inter','Segoe UI',sans-serif; font-size: 13px; font-weight: 700; fill: #e7e7e7; text-anchor: middle; }
      .subText { font-family: 'Inter','Segoe UI',sans-serif; font-size: 10.5px; fill: #8b949e; text-anchor: middle; }
      .laneLabel { font-family: 'Inter','Segoe UI',sans-serif; font-size: 13px; font-weight: 700; fill: #c9d1d9; }
      .lane { stroke: #30363d; stroke-width: 2; fill: none; }
      .commit { fill: #1565c0; stroke: #58a6ff; stroke-width: 1.5; }
      .note { font-family: 'Inter','Segoe UI',sans-serif; font-size: 12px; fill: #8b949e; }
      .arrow { stroke: #30363d; stroke-width: 2; marker-end: url(#arrowhead3); }
      .connector { stroke: #8b949e; stroke-width: 1.5; stroke-dasharray: 4 4; }
    </style>
    <marker id="arrowhead3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#30363d"/>
    </marker>
  </defs>
  <rect class="bg" width="760" height="330" rx="10"/>
  <text x="30" y="36" class="title">Migraciones versionadas — mismo orden en todo entorno</text>

  <!-- canonical migration chain -->
  <rect class="step" x="40" y="60" width="210" height="60" rx="6"/>
  <text x="145" y="84" class="stepText">001 · crea tabla product</text>
  <text x="145" y="102" class="subText">up: la crea / down: la elimina</text>

  <line x1="250" y1="90" x2="280" y2="90" class="arrow"/>

  <rect class="step" x="280" y="60" width="210" height="60" rx="6"/>
  <text x="385" y="84" class="stepText">002 · agrega price_cents</text>
  <text x="385" y="102" class="subText">up: agrega columna / down: la quita</text>

  <line x1="490" y1="90" x2="520" y2="90" class="arrow"/>

  <rect class="step" x="520" y="60" width="210" height="60" rx="6"/>
  <text x="625" y="84" class="stepText">003 · agrega índice email</text>
  <text x="625" y="102" class="subText">up: crea índice / down: lo elimina</text>

  <text x="30" y="148" class="note">Nunca se edita una migración ya aplicada — un cambio nuevo es una migración nueva.</text>

  <!-- environment lanes, same order applied everywhere -->
  <text x="30" y="196" class="laneLabel">Local</text>
  <line x1="90" y1="192" x2="700" y2="192" class="lane"/>
  <circle cx="145" cy="192" r="6" class="commit"/>
  <circle cx="385" cy="192" r="6" class="commit"/>
  <circle cx="625" cy="192" r="6" class="commit"/>

  <text x="30" y="236" class="laneLabel">CI</text>
  <line x1="90" y1="232" x2="700" y2="232" class="lane"/>
  <circle cx="145" cy="232" r="6" class="commit"/>
  <circle cx="385" cy="232" r="6" class="commit"/>
  <circle cx="625" cy="232" r="6" class="commit"/>

  <text x="30" y="276" class="laneLabel">Producción</text>
  <line x1="90" y1="272" x2="700" y2="272" class="lane"/>
  <circle cx="145" cy="272" r="6" class="commit"/>
  <circle cx="385" cy="272" r="6" class="commit"/>
  <circle cx="625" cy="272" r="6" class="commit"/>

  <line x1="145" y1="120" x2="145" y2="272" class="connector"/>
  <line x1="385" y1="120" x2="385" y2="272" class="connector"/>
  <line x1="625" y1="120" x2="625" y2="272" class="connector"/>

  <text x="30" y="310" class="note">Mismo id, mismo orden, en local, CI y producción — divergencia de esquema es un bug silencioso.</text>
</svg>
